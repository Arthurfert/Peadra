name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite3 native libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

  build-linux:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build deb package
        run: fastforge package --platform linux --targets deb

      - name: List output files
        run: find . -name "*.deb" -o -name "*.changes" -o -name "*.buildinfo" | head -20

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: peadra-linux-deb
          path: |
            dist/**/*.deb
            **/*.deb

  build-windows:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build msix package
        run: fastforge package --platform windows --targets msix

      - name: List output files
        run: Get-ChildItem -Recurse -Filter "*.msix" | Select-Object FullName

      - name: Upload msix artifact
        uses: actions/upload-artifact@v4
        with:
          name: peadra-windows-msix
          path: |
            dist/**/*.msix
            **/*.msix

  release:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: echo "tag=v$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: peadra-linux-deb
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: peadra-windows-msix
          path: artifacts/windows

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/linux/**/*.deb
            artifacts/windows/**/*.msix
