name: peadra
description: Peadra - Financial Asset Tracker
publish_to: 'none'
version: 2.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.4.0
  path: ^1.8.0
  path_provider: ^2.1.0
  crypto: ^3.0.0
  intl: ^0.19.0
  csv: ^5.1.0
  http: ^1.2.0
  provider: ^6.1.0
  fl_chart: ^0.68.0
  file_picker: ^10.3.10
  url_launcher: ^6.2.0
  package_info_plus: ^8.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#1a1a2e"
  adaptive_icon_foreground: "assets/icon.png"

msix_config:
  display_name: Peadra
  publisher_display_name: Peadra
  identity_name: com.peadra.app
  msix_version: 2.1.0.0
  logo_path: windows/runner/resources/app_icon.ico
  capabilities: internetClient
  publisher: CN=Peadra
  certificate_path: windows/packaging/msix/peadra.pfx
  certificate_password: YOUR_PASSWORD
  install_certificate: false
  sign_msix: true
  build_files_folder: build/windows/x64/runner/Release
