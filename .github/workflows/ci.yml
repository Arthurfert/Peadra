name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite3 native libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

  build-linux:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build deb package
        run: fastforge package --platform linux --targets deb

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: peadra-linux-deb
          path: dist/*.deb

  build-windows:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build msix package
        run: fastforge package --platform windows --targets msix

      - name: Upload msix artifact
        uses: actions/upload-artifact@v4
        with:
          name: peadra-windows-msix
          path: dist/*.msix
