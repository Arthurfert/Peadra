name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install SQLite3 native libraries
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-pub

      - name: Run tests
        run: flutter test

  build-linux:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev pkg-config

      - name: Install fastforge
        run: dart pub global activate fastforge

      - name: Build deb package
        run: fastforge package --platform linux --targets deb

      - name: List output files
        run: find . -name "*.deb" -o -name "*.changes" -o -name "*.buildinfo" | head -20

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: peadra-linux-deb
          path: |
            dist/**/*.deb
            **/*.deb

  build-windows:
    needs: test
    if: github.event_name == 'push'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode signing certificate
        run: |
          $pfxBytes = [Convert]::FromBase64String("${{ secrets.MSIX_CERTIFICATE }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\windows\packaging\msix\peadra.pfx", $pfxBytes)
        shell: pwsh

      - name: Install dependencies
        run: flutter pub get

      - name: Build msix package
        run: |
          (Get-Content pubspec.yaml) -replace 'YOUR_PASSWORD', '${{ secrets.MSIX_CERTIFICATE_PASSWORD }}' | Set-Content pubspec.yaml
          dart run msix:create

      - name: Export certificate public key
        run: |
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            "${{ github.workspace }}\windows\packaging\msix\peadra.pfx",
            "${{ secrets.MSIX_CERTIFICATE_PASSWORD }}",
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          )
          Export-Certificate -Cert $cert -FilePath peadra.cer -Type CERT
        shell: pwsh

      - name: List output files
        run: Get-ChildItem -Recurse -Filter "*.msix" | Select-Object FullName

      - name: Upload msix artifact
        uses: actions/upload-artifact@v4
        with:
          name: peadra-windows-msix
          path: |
            dist/**/*.msix
            **/*.msix

      - name: Upload certificate
        uses: actions/upload-artifact@v4
        with:
          name: peadra-certificate
          path: peadra.cer
          if-no-files-found: ignore

  release:
    needs: [build-linux, build-windows]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from pubspec.yaml
        id: version
        run: echo "tag=v$(grep 'version:' pubspec.yaml | head -1 | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: peadra-linux-deb
          path: artifacts/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: peadra-windows-msix
          path: artifacts/windows

      - name: Download certificate
        uses: actions/download-artifact@v4
        with:
          name: peadra-certificate
          path: artifacts/windows
        continue-on-error: true

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/linux/**/*.deb
            artifacts/windows/**/*.msix
            artifacts/windows/**/*.cer
